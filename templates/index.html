<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Sentiment Analysis</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >
</head>

<body>

<main class="page-container">

    <section class="app-card">

        <header class="app-header">
            <span class="badge">NLP · AI</span>

            <h1>Sentiment Analysis</h1>

            <p class="subtitle">
                Analyze the sentiment of text using a
                Transformer-based NLP model.
            </p>
        </header>

        <section class="analyzer">

            <label for="textToAnalyze">
                Text to analyze
            </label>

            <textarea
                id="textToAnalyze"
                rows="5"
                placeholder="Example: I really enjoyed working on this project."
            ></textarea>

            <button
                id="analyzeButton"
                type="button"
                onclick="RunSentimentAnalysis()"
            >
                Analyze Sentiment
            </button>

        </section>

        <section
            id="resultContainer"
            class="result-container hidden"
        >

            <p class="result-label">
                Sentiment
            </p>

            <div id="sentimentResult" class="sentiment-result">
            </div>

            <p class="confidence-label">
                Confidence
            </p>

            <div id="confidenceResult" class="confidence-result">
            </div>

        </section>

        <footer class="app-footer">
            <span>DistilBERT</span>
            <span>Hugging Face Transformers</span>
            <span>Flask</span>
        </footer>

    </section>

</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
